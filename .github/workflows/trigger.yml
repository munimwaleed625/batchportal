name: Trigger Core Sync

# LOCAL FOLDER: D:\batchportal-api
# GITHUB REPO : munimwaleed625/batchportal   (default branch: main)
# RULE        : api_core
#
# This file copies nothing. It only signals the newcrud repo, which does the merge.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch to sync from"
        required: false
        default: "main"

  # Uncomment for automatic sync on every push (you lose manual control)
  # push:
  #   branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send a sync request to newcrud
        env:
          TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
          CORE_REPO: munimwaleed625/newcrud
          RULE: api_core
          SRC_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Secret CORE_SYNC_TOKEN is not set in this repo"; exit 1
          fi

          BODY=$(jq -nc \
            --arg rule "$RULE" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref  "$SRC_REF" \
            --arg sha  "$GITHUB_SHA" \
            '{event_type: "sync-request",
              client_payload: {rule: $rule, source_repo: $repo, ref: $ref, sha: $sha}}')

          echo "Dispatching -> $CORE_REPO  (rule: $RULE, ref: $SRC_REF)"

          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$CORE_REPO/dispatches" \
            -d "$BODY"

          echo "Dispatch sent. Check the Actions tab of the newcrud repo."
