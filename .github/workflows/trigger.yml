name: Trigger Core Sync

# REPO: batchportal-api      RULE: api_core
# Ye file sirf newcrud-core ko signal bhejti hai; merge core karta hai.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Kis branch se sync karna hai"
        required: false
        default: "main"

  # Auto-sync chahiye to uncomment karo (phir manual control chala jayega)
  # push:
  #   branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name:Sync request
        env:
          TOKEN: ${{ secrets.CORE_SYNC_TOKEN }}
          CORE_REPO: munimwaleed625/newcrud-core
          RULE: api_core
          SRC_REF: ${{ inputs.ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Secret CORE_SYNC_TOKEN is repo me set nahi hai"; exit 1
          fi

          BODY=$(jq -nc \
            --arg rule "$RULE" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref  "$SRC_REF" \
            --arg sha  "$GITHUB_SHA" \
            '{event_type: "sync-request",
              client_payload: {rule: $rule, source_repo: $repo, ref: $ref, sha: $sha}}')

          echo "Dispatching -> $CORE_REPO  (rule: $RULE, ref: $SRC_REF)"

          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$CORE_REPO/dispatches" \
            -d "$BODY"

          echo "Triggered"